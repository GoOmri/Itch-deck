name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]   # notes-only commits don't rebuild the binary
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # 22.04 = glibc 2.35, older than SteamOS, so the binary runs on the Deck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller
      - name: Refuse to ship secrets
        run: "! git ls-files | grep -iE '(config\\.json|itch_key|\\.key$)'"
      - run: pyinstaller --onefile --name itch-deck --add-data itch_deck/assets:itch_deck/assets run.py
      - name: Smoke test
        run: ./dist/itch-deck --selftest
      - name: Render mockups (draws every page/state; also a crash test)
        run: ./dist/itch-deck --render-mockups mockups
      - uses: actions/upload-artifact@v4
        with: { name: mockups, path: mockups }
      - uses: actions/upload-artifact@v4
        with: { name: itch-deck, path: dist/itch-deck }
      # Release on every main push, tagged with VERSION from app.py (bump it to publish a new one)
      - id: ver
        run: echo "v=$(grep -oP 'VERSION = "\K[^"]+' itch_deck/app.py)" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/itch-deck
