name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # 22.04 = glibc 2.35, older than SteamOS, so the binary runs on the Deck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller
      - name: Refuse to ship secrets
        run: "! git ls-files | grep -iE '(config\\.json|itch_key|\\.key$)'"
      - run: pyinstaller --onefile --name itch-deck run.py
      - name: Smoke test
        run: ./dist/itch-deck --selftest
      - uses: actions/upload-artifact@v4
        with: { name: itch-deck, path: dist/itch-deck }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/itch-deck }
