name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]   # notes-only commits don't rebuild the binary
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # 22.04 = glibc 2.35, older than SteamOS, so the binary runs on the Deck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q tests
      - name: HowLongToBeat still answers (warning only)
        continue-on-error: true
        run: python -m itch_deck.hltb Celeste "Circa Infinity"
      - name: Refuse to ship secrets
        run: "! git ls-files | grep -iE '(config\\.json|itch_key|\\.key$)'"
      # Folder build packed behind packaging/launcher.sh (v0.7.4: starts faster than --onefile)
      - run: sh packaging/build.sh
      - name: Smoke test (through the launcher, which unpacks into release/app)
        run: ./release/scritch --selftest
      - name: Render mockups (draws every page/state; also a crash test)
        run: ./release/scritch --render-mockups mockups
      - uses: actions/upload-artifact@v4
        with: { name: mockups, path: mockups }
      - uses: actions/upload-artifact@v4
        with: { name: scritch, path: release/scritch }
      # Release on every main push, tagged with VERSION from app.py (bump it to publish a new one)
      - id: ver
        run: echo "v=$(grep -oP 'VERSION = "\K[^"]+' itch_deck/app.py)" >> "$GITHUB_OUTPUT"
      # Never overwrite a published version: a push to main without a VERSION bump builds and
      # tests as usual but releases nothing (it used to replace the binary of the same version).
      - id: exists
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "v${{ steps.ver.outputs.v }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::warning::v${{ steps.ver.outputs.v }} is already released - bump VERSION in itch_deck/app.py to publish"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: github.ref == 'refs/heads/main' && steps.exists.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: |
            release/scritch
            release/itch-deck
