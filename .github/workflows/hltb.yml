name: hltb-live
# Live check of the HowLongToBeat client (HLTB changes its site; this tells us early).
# Branches only, never releases. Main's build step runs the same check as a warning.
on:
  push:
    branches-ignore: [main]
    paths: ["itch_deck/hltb.py", ".github/workflows/hltb.yml"]
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m itch_deck.hltb Celeste "Circa Infinity" "Cosmic Express" "Baba Is You" "Not A Real Game 12345"
      - name: Reference (howlongtobeatpy) for comparison
        if: always()
        run: |
          pip install howlongtobeatpy
          python -c "
          import logging; logging.basicConfig(level=logging.DEBUG)
          from howlongtobeatpy import HowLongToBeat
          from howlongtobeatpy.HTMLRequests import HTMLRequests as H
          from fake_useragent import UserAgent
          ua = UserAgent().random
          si = H.send_website_request_getcode(ua); print('search url', si and si.search_url)
          a = H.send_website_get_auth_token(si and si.search_url, ua); print('auth', a and vars(a))
          r = HowLongToBeat().search('Celeste'); print([(x.game_name, x.main_story) for x in r or []])"
